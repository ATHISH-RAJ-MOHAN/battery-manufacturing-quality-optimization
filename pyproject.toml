[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-quality-intelligence"
version = "0.1.0"
description = "Reproducible synthetic battery manufacturing quality research"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.14,<2", "pyarrow>=18,<24", "scikit-learn>=1.6,<2", "xgboost>=2.1,<4", "lightgbm>=4.5,<5", "shap>=0.46,<1", "streamlit>=1.40,<2", "plotly>=5.24,<7", "matplotlib>=3.9,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

